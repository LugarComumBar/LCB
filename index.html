    <title>Lugar Comum Bar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        html, body { max-width: 100%; overflow-x: hidden; background: #fff; }
    </style>
</head>
<body>
    <script>
        var API_URL_GATE = "https://script.google.com/macros/s/AKfycbyawZahFXeytjgTj2-yId6TIQwF7RoSqF2alHUj4AF46Huhmsl4keW4bUm6sakf8p_M/exec";

        // ---------- gate de acesso: pontos (padrão arrastado) + e-mail/senha ----------
        // Tudo conferido no servidor (Apps Script): nenhuma resposta certa fica neste arquivo público.
        // Passou uma vez: fica "lembrado" neste aparelho e vai direto pra /s (o sistema). Mesmo lembrado, confere
        // de novo e bem rápido se o e-mail ainda está liberado antes de deixar passar (removeu o e-mail da
        // planilha = aparelho barrado de novo, mesmo já tendo passado antes).
        (function () {
            var fetchGate = window.fetch.bind(window);
            var GATE_SESSAO = 'lcb_gate1';
            // mesmo identificador de aparelho usado dentro do sistema (/s): guardado 1x no navegador, serve pra
            // contar tentativas erradas e pra bloquear/liberar esse aparelho na aba Bloqueados, igual ao sistema.
            var DEV = (function () {
                try {
                    var d = localStorage.getItem('lcb_dev');
                    if (!d) { d = Math.random().toString(36).substring(2, 6); localStorage.setItem('lcb_dev', d); }
                    return d;
                } catch (e) { return ''; }
            })();
            function gateMesAtual() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1); } // vira o mês = esqueceu o aparelho, pede tudo de novo
            function gateLer() {
                try {
                    var v = JSON.parse(localStorage.getItem(GATE_SESSAO) || 'null');
                    return (v && v.email && v.mes === gateMesAtual()) ? v : null;
                } catch (e) { return null; }
            }
            function gateGravar(email) {
                try { if (email) localStorage.setItem(GATE_SESSAO, JSON.stringify({ email: email, mes: gateMesAtual() })); else localStorage.removeItem(GATE_SESSAO); } catch (e) {}
            }
            function gateChamar(qs) {
                return fetchGate(API_URL_GATE + '?' + qs + '&dev=' + encodeURIComponent(DEV)).then(function (r) { return r.json(); }).catch(function () { return { ok: false, erroRede: true }; });
            }
            // mensagem padrão quando o servidor diz que esse aparelho está bloqueado (mesma regra do sistema: 5
            // erradas = 10 min, dobrando a cada vez, até 24h; "desligado" = bloqueio permanente marcado na planilha).
            function mensagemBloqueio_(j) {
                if (j && j.desligado) return 'Este aparelho foi desativado. Fale com o responsável.';
                if (j && j.bloqueado) return 'Muitas tentativas erradas. Tente de novo em ' + (j.minutos || 1) + ' min.';
                return null;
            }
            function irProSistema() { location.href = '/s/'; }

            var sessaoGate = gateLer();
            if (sessaoGate && sessaoGate.email) {
                gateChamar('acao=gate_ainda&email=' + encodeURIComponent(sessaoGate.email)).then(function (j) {
                    if (j && j.erroRede) { irProSistema(); return; } // sem internet pra checar agora: não tranca por causa disso (o login do sistema ainda protege)
                    if (j && j.ok) irProSistema();
                    else { gateGravar(''); montarTelaPontos(); }
                });
                return;
            }
            montarTelaPontos();

            // texto fixo no rodapé da tela branca (fica em cima de tudo, nas duas telas do gate)
            function montarRodape(overlay) {
                var rod = document.createElement('div');
                rod.style.cssText = 'position:absolute; right:16px; bottom:12px; text-align:right; pointer-events:none; font-family:\'Helvetica Neue\',Arial,sans-serif; font-weight:800; text-transform:uppercase; color:#b91c1c; font-size:2.4rem; line-height:1.2; letter-spacing:2px; z-index:2;';
                rod.innerHTML = 'Lugar Comum<br>Bar';
                overlay.appendChild(rod);
            }
            // e-mail/senha errados na tela de login: essa figura aparece por trás do rodapé (só um easter egg).
            function mostrarFiguraErro_(overlay) {
                if (document.getElementById('gate-figura-erro')) return;

            // ---------- tela 1: os 16 pontos (desenha um padrão arrastando) ----------
            function montarTelaPontos() {
                var overlay = document.createElement('div');
                overlay.id = 'gate-overlay';
                overlay.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:none;';
                document.body.appendChild(overlay);
                montarRodape(overlay);

                var tam = Math.min(320, Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.8));
                var svgNS = 'http://www.w3.org/2000/svg';
                var svg = document.createElementNS(svgNS, 'svg');
                svg.setAttribute('width', tam); svg.setAttribute('height', tam);
                svg.style.touchAction = 'none';
                overlay.appendChild(svg);
                var msg = document.createElement('div');
                msg.style.cssText = 'margin-top:1.2rem;font-weight:bold;min-height:1.3em;font-family:sans-serif;color:#b91c1c;';
                overlay.appendChild(msg);

                var pontos = [];
                var n = 4, margem = tam * 0.14, passo = (tam - 2 * margem) / (n - 1);
                for (var i = 0; i < 16; i++) {
                    var lin = Math.floor(i / 4), col = i % 4;
                    pontos.push({ id: i + 1, x: margem + col * passo, y: margem + lin * passo });
                }
                var raioPonto = tam * 0.035, raioToque = tam * 0.09;

                function linha(a, b) {
                    var l = document.createElementNS(svgNS, 'line');
                    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
                    l.setAttribute('stroke', '#b91c1c'); l.setAttribute('stroke-width', Math.max(2, tam * 0.012));
                    svg.appendChild(l);
                }
                function desenhar(ativos, pontaSolta) {
                    while (svg.firstChild) svg.removeChild(svg.firstChild);
                    for (var i = 1; i < ativos.length; i++) linha(pontos[ativos[i - 1] - 1], pontos[ativos[i] - 1]);
                    if (pontaSolta && ativos.length) linha(pontos[ativos[ativos.length - 1] - 1], pontaSolta);
                    pontos.forEach(function (p) {
                        var ativo = ativos.indexOf(p.id) >= 0;
                        var c = document.createElementNS(svgNS, 'circle');
                        c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', raioPonto);
                        c.setAttribute('fill', ativo ? '#b91c1c' : '#ddd');
                        svg.appendChild(c);
                        var t = document.createElementNS(svgNS, 'text');
                        t.setAttribute('x', p.x); t.setAttribute('y', p.y);
                        t.setAttribute('text-anchor', 'middle');
                        t.setAttribute('dominant-baseline', 'central');
                        t.setAttribute('font-size', raioPonto * 1.1);
                        t.setAttribute('font-family', 'sans-serif');
                        t.setAttribute('font-weight', 'bold');
                        t.setAttribute('fill', ativo ? '#ffd400' : '#666');
                        t.setAttribute('pointer-events', 'none');
                        t.textContent = p.id;
                        svg.appendChild(t);
                    });
                }
                desenhar([], null);

                var ativos = [], desenhando = false, travado = false;
                function pontoEm(x, y) {
                    for (var i = 0; i < pontos.length; i++) {
                        var p = pontos[i], dx = x - p.x, dy = y - p.y;
                        if (dx * dx + dy * dy <= raioToque * raioToque) return p.id;
                    }
                    return null;
                }
                function coordLocal(ev) {
                    var r = svg.getBoundingClientRect();
                    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
                }
                svg.addEventListener('pointerdown', function (ev) {
                    if (travado) return;
                    msg.textContent = '';
                    var c = coordLocal(ev), id = pontoEm(c.x, c.y);
                    ativos = id ? [id] : [];
                    desenhando = true;
                    desenhar(ativos, null);
                    ev.preventDefault();
                });
                svg.addEventListener('pointermove', function (ev) {
                    if (!desenhando || travado) return;
                    var c = coordLocal(ev), id = pontoEm(c.x, c.y);
                    if (id && ativos.indexOf(id) < 0) ativos.push(id);
                    desenhar(ativos, c);
                    ev.preventDefault();
                });
                function soltar(ev) {
                    if (!desenhando || travado) return;
                    desenhando = false;
                    desenhar(ativos, null);
                    if (ativos.length < 2) { ativos = []; desenhar(ativos, null); return; }
                    travado = true;
                    msg.style.color = '#666'; msg.textContent = 'Conferindo...';
                    gateChamar('acao=gate_pontos&seq=' + ativos.join(',')).then(function (j) {
                        travado = false;
                        if (j && j.ok) { montarTelaLogin(); }
                        else {
                            var msgBloq = mensagemBloqueio_(j);
                            msg.style.color = '#b91c1c';
                            msg.textContent = msgBloq || ((j && j.erroRede) ? 'Sem conexão — tente de novo.' : 'Padrão errado. Tente de novo.');
                            ativos = []; desenhar(ativos, null);
                        }
                    });
                }
                svg.addEventListener('pointerup', soltar);
                svg.addEventListener('pointerleave', soltar);
            }

            // ---------- tela 2: e-mail + senha ----------
            function montarTelaLogin() {
                var overlay = document.getElementById('gate-overlay');
                overlay.innerHTML = '<div style="background:#fff;max-width:22rem;width:100%;padding:1.5rem;font-family:sans-serif;box-sizing:border-box;border:4px solid #b91c1c;border-radius:0.6rem;">' +
                    '<h3 style="margin-bottom:1rem;color:#b91c1c;">Entrar</h3>' +
                    '<div id="gate-login-erro" style="color:#b91c1c;font-weight:bold;margin-bottom:0.5rem;min-height:1.2em;"></div>' +
                    '<label style="font-size:0.85rem;color:#b91c1c;">E-mail:</label>' +
                    '<input type="email" id="gate-email" autocomplete="username" style="width:100%;margin:0.25rem 0 0.75rem;padding:0.4rem;box-sizing:border-box;">' +
                    '<label style="font-size:0.85rem;color:#b91c1c;">Senha:</label>' +
                    '<input type="password" id="gate-senha" autocomplete="current-password" style="width:100%;margin:0.25rem 0 0.4rem;padding:0.4rem;box-sizing:border-box;">' +
                    '<label style="display:block;font-size:0.85rem;color:#b91c1c;margin-bottom:0.75rem;"><input type="checkbox" id="gate-ver-senha" style="width:auto;display:inline-block;margin-right:0.4rem;"> Mostrar senha</label>' +
                    '<button type="button" id="gate-entrar" style="width:100%;padding:0.6rem;background:#b91c1c;color:#fff;border:none;border-radius:0.4rem;font-weight:bold;">Entrar</button>' +
                    '</div>';
                montarRodape(overlay);
                var campoSenha = document.getElementById('gate-senha');
                campoSenha.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') document.getElementById('gate-entrar').click(); });
                document.getElementById('gate-ver-senha').addEventListener('change', function () { campoSenha.type = this.checked ? 'text' : 'password'; });
                document.getElementById('gate-entrar').addEventListener('click', function () {
                    var email = document.getElementById('gate-email').value.trim();
                    var senha = document.getElementById('gate-senha').value.trim();
                    var erroEl = document.getElementById('gate-login-erro');
                    if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; return; }
                    var btn = document.getElementById('gate-entrar');
                    btn.disabled = true; btn.textContent = 'Entrando...';
                    gateChamar('acao=gate_login&email=' + encodeURIComponent(email) + '&senha=' + encodeURIComponent(senha)).then(function (j) {
                        if (j && j.ok) {
                            gateGravar(email.toLowerCase());
                            irProSistema();
                        } else {
                            btn.disabled = false; btn.textContent = 'Entrar';
                            var msgBloq = mensagemBloqueio_(j);
                            if (msgBloq) { erroEl.textContent = msgBloq; }
                            else if (j && j.erroRede) { erroEl.textContent = 'Sem conexão — tente de novo.'; }
                            else if (j && j.desbloqueado) { erroEl.textContent = 'Bloqueio removido. Pode tentar de novo.'; }
                            else { erroEl.textContent = 'E-mail ou senha incorretos.'; mostrarFiguraErro_(overlay); }
                        }
                    });
                });
            }
        })();
    </script>
